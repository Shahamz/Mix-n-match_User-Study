# ----------------------------------------------------------------------------
# Mix-n-match user study — build configuration.
#
# build_study.py walks whatever is present under `root` and emits data/manifest.json
# plus the WebP assets the page serves. Every number below is a *quota per config*,
# so the item bank rescales automatically when configs are added or removed.
# ----------------------------------------------------------------------------

# Where the sources live, relative to the repo root (or pass --root on the CLI).
root: .
config_dir: configs_for_baseline
outputs_dir: outputs

# Deterministic item bank. Change this only if you want a different draw.
seed: 20260914

# The method under test. Everything else is a baseline it is compared against.
reference_method: mix_n_match

# ---------------------------------------------------------------------------
# Which sets each baseline may appear in, per question level.
#
# tiled_diffusion generates whole 1024x1024 images per crop and seam-constrains
# them as a *vertical chain*. That only corresponds to the config's crop boxes
# when the boxes are full-width bands stacked top to bottom, which holds for the
# static set and almost never for the dynamic one. Tile-level questions need no
# stitching at all, so they are unrestricted.
# ---------------------------------------------------------------------------
methods:
  mnm_baseline:
    tile_sets: [static, dynamic]
    composite_sets: [static, dynamic]   # dynamic needs a background source on disk;
                                        # skipped with a reason if there is none
  regional_prompting:
    tile_sets: [static, dynamic]
    composite_sets: [static, dynamic]
  tiled_diffusion:
    tile_sets: [static, dynamic]
    composite_sets: [static]

# Build composite items even where the stitching assumption is only approximate
# (a non-vertical-band layout for tiled_diffusion). They are tagged
# stitch_faithful:false so the analysis can report with and without them.
allow_approximate_stitching: false

# ---------------------------------------------------------------------------
# Item bank quotas, per config. A quota is a ceiling: the builder emits fewer
# when a config does not have enough crops/tiles or a run folder is missing.
# ---------------------------------------------------------------------------
quotas:
  tile_ab_adherence: 2      # per baseline -> up to 6 per config
  tile_ab_quality: 1        # per baseline -> up to 3 per config
  comp_ab_coherence: 1      # per baseline
  comp_ab_adherence: 1      # per baseline
  tile_bw4: 1               # four-way best/worst on one region
  comp_bw4: 1               # four-way best/worst on a whole image

# Attention checks are drawn from the finished bank: an ordinary-looking item
# whose second option is a tile from an unrelated config, so the correct answer
# is obvious to anyone actually reading the prompt.
attention_checks: 6         # size of the pool; each participant is served 2

# ---------------------------------------------------------------------------
# Asset encoding. Content-hashed filenames, so identical renders are stored once.
# ---------------------------------------------------------------------------
assets:
  format: webp
  quality: 82
  tile_max_side: 768
  composite_max_side: 900
  background: [246, 246, 248]   # neutral mat behind irregular tiles

# What each participant is served. sampler.js reads this straight from the manifest.
# `composition` is the target number of screens of each type; the sampler backfills from
# whatever else the bank holds if a type runs short, and never exceeds items_per_participant.
session:
  items_per_participant: 30
  practice_items: 1
  composition:
    tile_ab_adherence: 9      # 3 per baseline
    tile_ab_quality: 3        # 1 per baseline
    comp_ab_coherence: 6      # 2 per baseline
    comp_ab_adherence: 4
    tile_bw4: 2
    comp_bw4: 2
    attention: 2
