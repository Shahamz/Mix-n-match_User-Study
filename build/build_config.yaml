# ----------------------------------------------------------------------------
# Mix-n-match user study — build configuration.
#
# build_study.py walks whatever is present under `root` and emits data/manifest.json
# plus the WebP assets the page serves. Every number below is a *quota per config*,
# so the item bank rescales automatically when configs are added or removed.
# ----------------------------------------------------------------------------

# Where the sources live, relative to the repo root (or pass --root on the CLI).
root: .
config_dir: configs_for_baseline
outputs_dir: outputs

# Deterministic item bank. Change this only if you want a different draw.
seed: 20260914

# The method under test. Everything else is a baseline it is compared against.
reference_method: mix_n_match

# ---------------------------------------------------------------------------
# Which sets each baseline may be compared in.
# ---------------------------------------------------------------------------
methods:
  mnm_baseline:
    # Assembled from the config's crop rectangles. Where they do not tile the canvas
    # the remainder stays black: the baseline generates no background image.
    composite_sets: [static, dynamic]
  regional_prompting:
    composite_sets: [static, dynamic]
  tiled_diffusion:
    # Its chain layout ignores the config's boxes entirely, so every config works.
    composite_sets: [static, dynamic]

# Kept for the loader; no method currently needs an approximate reconstruction.
# Tiled Diffusion is rebuilt exactly from its own run_meta.json, and the naive
# baseline from the config's crop rectangles.
allow_approximate_stitching: false

# ---------------------------------------------------------------------------
# Item bank quotas, per config. A quota is a ceiling: the builder emits fewer
# when a config does not have enough crops/tiles or a run folder is missing.
# ---------------------------------------------------------------------------
quotas:
  # Rounds per config. Each round draws `combinations_per_method` tile combinations and
  # compares our set of composites against every available baseline's set for those same
  # combinations, so a round yields up to three comparisons.
  pairs_per_baseline: 2

# ---------------------------------------------------------------------------
# What one question shows.
# ---------------------------------------------------------------------------
# How many images each method shows per question. Each image is one tile combination
# (one tile per crop); both methods in a question show the same combinations in the
# same order, so image 1 of one set and image 1 of the other illustrate the same
# descriptions. Combinations within a set are distinct. A config with fewer distinct
# combinations than this shows all it has (noted in the build report).
combinations_per_method: 4

# ---------------------------------------------------------------------------
# Asset encoding. Content-hashed filenames, so identical renders are stored once.
# ---------------------------------------------------------------------------
assets:
  format: webp
  quality: 82
  # Both pictures in a pair are encoded at this width, so the comparison is at one
  # scale. Height is left free: a Tiled Diffusion stack really is taller than a
  # square canvas and is shown that way rather than squashed.
  composite_width: 860
  # Grid thumbnails. The full-width image is loaded only when a picture is enlarged
  # or the screen is wide and dense enough to need it.
  thumb_width: 480
  background: [246, 246, 248]   # neutral mat behind irregular tiles

# What each participant is served. sampler.js reads this straight from the manifest.
# `composition` is the target number of screens of each type; the sampler backfills from
# whatever else the bank holds if a type runs short, and never exceeds items_per_participant.
session:
  items_per_participant: 30
